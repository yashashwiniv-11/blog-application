<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogify – Create Blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="anti-gravity-container"></div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><span>✍️</span> Blogify</a>
      <button class="menu-toggle" aria-label="Toggle menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="create-blog.html" class="active">Create Blog</a></li>
        <li><a href="login.html" class="btn btn-outline">Login</a></li>
        <li><a href="register.html" class="btn btn-primary">Sign Up</a></li>
      </ul>
    </div>
  </nav>

  <section class="section">
    <h2 class="section-title text-center">Create a New Blog Post</h2>
    <p class="section-subtitle text-center">Share your ideas with the world</p>

    <div class="create-form float-card">
      <form id="createBlogForm">
        <div class="form-group">
          <label for="title">Post Title</label>
          <input type="text" id="title" placeholder="Enter an engaging title..." required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">Select category</option>
              <option value="technology">Technology</option>
              <option value="design">Design</option>
              <option value="productivity">Productivity</option>
              <option value="lifestyle">Lifestyle</option>
              <option value="javascript">JavaScript</option>
              <option value="mindfulness">Mindfulness</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" required>
              <option value="published">Publish Now</option>
              <option value="draft">Save as Draft</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="excerpt">Short Excerpt</label>
          <input type="text" id="excerpt" placeholder="A brief summary of your post (shown on cards)">
        </div>

        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" placeholder="Write your blog post here... (Markdown supported in full version)" required></textarea>
        </div>

        <div class="form-group">
          <label for="tags">Tags (comma separated)</label>
          <input type="text" id="tags" placeholder="e.g. webdev, css, beginners">
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;">
          <button type="submit" class="btn btn-primary">Publish Post</button>
          <a href="dashboard.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </section>

  <footer class="footer">
    <p>© 2026 Blogify · Built with HTML, CSS & JavaScript</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
